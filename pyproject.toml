[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tgharbor"
version = "0.1.0.dev0"
description = "Self-hosted Telegram downloader and archive manager."
readme = "README.md"
requires-python = ">=3.15"
license = { text = "Apache-2.0" }
authors = [
  { name = "shareur" }
]
dependencies = [
  "telethon>=1.45,<2.0",
  "aiosqlite>=0.20,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "ruff>=0.17,<1.0",
]

[project.scripts]
tgharbor = "tgharbor.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/tgharbor"]
