[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tgharbor"
version = "0.2.0"
description = "Self-hosted Telegram downloader and archive manager."
readme = "README.md"
requires-python = ">=3.15"
license = { text = "Apache-2.0" }
authors = [
  { name = "shareur" }
]
dependencies = [
  "telethon>=1.45,<2.0",
  "aiosqlite>=0.20,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "hatchling>=1.27,<2.0",
  "pip-audit>=2.9,<3.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "ruff>=0.17,<1.0",
]

[project.scripts]
tgharbor = "tgharbor.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.hatch.build.targets.wheel]
include = ["/src/tgharbor/**/*.py"]
sources = ["src"]

# Default-deny source-distribution boundary: only these public inputs may enter
# an sdist. Git ignore rules and Docker ignore rules are not package security
# controls, so local configuration, credentials, sessions, databases, logs,
# downloads, reference archives, tests, and full documentation must be excluded
# by construction rather than by omission. The artifact contract test builds
# both distributions and rejects any unexpected member.
[tool.hatch.build.targets.sdist]
include = [
  "/src/tgharbor/**/*.py",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/hatch_build.py",
]
# Selection must not depend on VCS ignore patterns.
ignore-vcs = true

# Hatchling force-adds the root VCS ignore file after selection. This sdist-only
# hook removes that one builder-added member. The public helper is packaged so
# rebuilding either distribution from an unpacked sdist is self-contained.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
