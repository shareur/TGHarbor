name: Feature request
description: Propose a scoped TGHarbor improvement
title: "[Feature]: "
labels: [ enhancement ]
body:
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: Describe the user need without private Telegram content.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behavior
    description: Include authorization, persistence, failure, and recovery expectations.
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives considered
