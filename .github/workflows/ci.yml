name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m pip_audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" \
            | sha256sum --check --strict -
          install_root="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$install_root"
          tar --extract --gzip --file "$archive" --directory "$install_root" \
            --no-same-owner --no-same-permissions gitleaks
          printf '%s\n' "$install_root" >> "$GITHUB_PATH"
          "$install_root/gitleaks" version
      - name: Scan complete reachable history
        shell: bash
        run: |
          set -uo pipefail
          if ! git rev-parse --verify --quiet HEAD >/dev/null; then
            echo "::error title=Secret scan failed::No reachable commit is checked out; refusing to report a clean scan." >&2
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error title=Secret scan failed::Repository history is shallow; complete reachable history is required." >&2
            exit 1
          fi
          status=0
          gitleaks git . \
            --redact=100 \
            --no-banner \
            --no-color \
            --verbose \
            --exit-code 2 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Gitleaks scanned the complete reachable history and found no leaks."
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error title=Secret findings::Gitleaks reported at least one finding. Values are redacted; rotate any exposed credential before merging." >&2
            exit 2
          fi
          echo "::error title=Secret scan failed::Gitleaks did not complete the scan (exit ${status}). This is an operational failure, not a clean result." >&2
          exit 1
