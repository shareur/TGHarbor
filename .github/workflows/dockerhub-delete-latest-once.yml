name: One-time Docker Hub latest alias removal

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: shareur-tgharbor-delete-latest-once
    cancel-in-progress: false

jobs:
    remove-latest:
        name: Remove only the authorized mutable latest tag
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: dockerhub-release
        steps:
            - name: Delete latest after fail-closed verification
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json
                  import os
                  import sys
                  import time
                  import urllib.error
                  import urllib.parse
                  import urllib.request

                  TAG_ROOT = "https://hub.docker.com/v2/repositories/shareur/tgharbor/tags"
                  LOGIN_URL = "https://hub.docker.com/v2/users/login/"
                  EXPECTED_OLD_DIGEST = (
                      "sha256:b40996ef4938f8545e5eaee86c91fc57b3d27f9b087353d02a97ae7548c5f560"
                  )
                  IMMUTABLE = {
                      "0.2.1": EXPECTED_OLD_DIGEST,
                      "sha-13c5bc7645b9": EXPECTED_OLD_DIGEST,
                  }
                  MUST_BE_ABSENT = ("0.2", "0.2.3", "sha-f9e64207f08c")


                  def fail(message):
                      print(f"::error title=One-time latest removal failed::{message}", file=sys.stderr)
                      raise SystemExit(1)


                  def http(url, *, method="GET", headers=None, data=None):
                      request = urllib.request.Request(
                          url, method=method, headers=headers or {}, data=data
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              return response.status, response.read(1_000_000)
                      except urllib.error.HTTPError as exc:
                          return exc.code, b""


                  def tag_digest(tag, authorization):
                      status, body = http(
                          f"{TAG_ROOT}/{urllib.parse.quote(tag, safe='')}/",
                          headers={
                              "Accept": "application/json",
                              "Authorization": authorization,
                          },
                      )
                      if status == 404:
                          return None
                      if status != 200:
                          fail(f"tag lookup for {tag} returned HTTP {status}")
                      try:
                          document = json.loads(body.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          fail(f"tag lookup for {tag} returned invalid JSON")
                      digest = document.get("digest")
                      if not isinstance(digest, str) or not digest:
                          fail(f"tag lookup for {tag} returned no digest")
                      return digest


                  username = os.environ.get("DOCKERHUB_USERNAME", "")
                  token = os.environ.get("DOCKERHUB_TOKEN", "")
                  if not username or not token:
                      fail("registry credential secrets are unavailable")

                  login_payload = json.dumps(
                      {"username": username, "password": token}
                  ).encode("utf-8")
                  status, body = http(
                      LOGIN_URL,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                      data=login_payload,
                  )
                  if status != 200:
                      fail("registry authentication was rejected")
                  try:
                      jwt = json.loads(body.decode("utf-8")).get("token")
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      fail("registry authentication returned invalid JSON")
                  if not isinstance(jwt, str) or not jwt:
                      fail("registry authentication returned no token")
                  authorization = f"JWT {jwt}"

                  if tag_digest("latest", authorization) != EXPECTED_OLD_DIGEST:
                      fail("latest does not resolve to the expected recorded old digest")
                  for tag, expected in IMMUTABLE.items():
                      if tag_digest(tag, authorization) != expected:
                          fail(f"immutable tag {tag} moved from its recorded digest")
                  for tag in MUST_BE_ABSENT:
                      if tag_digest(tag, authorization) is not None:
                          fail(f"unexpected pre-existing target tag {tag}")
                  print(
                      "Preconditions verified: latest and immutable tags match the recorded "
                      "old identity; new targets absent."
                  )

                  delete_status, _ = http(
                      f"{TAG_ROOT}/latest/",
                      method="DELETE",
                      headers={
                          "Accept": "application/json",
                          "Authorization": authorization,
                      },
                  )
                  if delete_status not in (200, 202, 204):
                      fail(f"the single DELETE of latest returned HTTP {delete_status}")
                  print(
                      f"Deleted latest with HTTP {delete_status}; "
                      "no further DELETE will be issued."
                  )

                  for _attempt in range(1, 31):
                      latest_absent = tag_digest("latest", authorization) is None
                      minor_absent = tag_digest("0.2", authorization) is None
                      immutable_ok = all(
                          tag_digest(tag, authorization) == digest
                          for tag, digest in IMMUTABLE.items()
                      )
                      new_absent = all(
                          tag_digest(tag, authorization) is None
                          for tag in ("0.2.3", "sha-f9e64207f08c")
                      )
                      if latest_absent and minor_absent and immutable_ok and new_absent:
                          print(
                              "Postconditions verified: latest and 0.2 absent; immutable tags "
                              "unchanged; new targets absent."
                          )
                          raise SystemExit(0)
                      time.sleep(4.0)
                  fail("postconditions did not converge after the single DELETE")
                  PY
