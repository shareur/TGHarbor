services:
  tgharbor:
    build:
      context: .
      dockerfile: Dockerfile
    image: tgharbor:0.1
    container_name: tgharbor
    restart: unless-stopped
    init: true
    user: "${TGHARBOR_UID:-1000}:${TGHARBOR_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      TGHARBOR_CONFIG: /config/config.yaml
      TGHARBOR_DATABASE_PATH: /data/tgharbor.db
      TGHARBOR_SESSIONS_PATH: /data/sessions
      TGHARBOR_DOWNLOADS_PATH: /downloads
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - type: volume
        source: tgharbor_data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: tgharbor_downloads
        target: /downloads
        volume:
          nocopy: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  tgharbor_data:
    name: tgharbor_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/tgharbor/data

  tgharbor_downloads:
    name: tgharbor_downloads
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/tgharbor/downloads
